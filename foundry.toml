[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
test = 'test'
script = 'script'
solc_version = '0.8.26'
evm_version = 'cancun'
optimizer = true
optimizer_runs = 999
via_ir = false
fs_permissions = [{ access = "read", path = "./" }]
# 2394: transient storage warning (Balancer libs), 5574/3860: contract size warnings in test helpers
ignored_error_codes = [2394, 5574, 3860]

[fuzz]
runs = 256
max_test_rejects = 60000

[rpc_endpoints]
sonic = "${SONIC_RPC_URL}"

[fmt]
ignore = ["test/vendor/*.sol"]
line_length = 120
tab_width = 4
bracket_spacing = true
